name: Production deployment

on:
  workflow_run:
    workflows:
      - Pull request CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  frontend:
    name: Deploy frontend
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
      VITE_SITE_ORIGIN: ${{ vars.VITE_SITE_ORIGIN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate required frontend variables
        run: |
          for name in AWS_REGION AWS_ROLE_ARN CLOUDFRONT_DISTRIBUTION_ID S3_BUCKET VITE_API_ORIGIN VITE_SITE_ORIGIN; do
            if [[ -z "${!name}" ]]; then
              echo "Required repository variable $name is not configured." >&2
              exit 1
            fi
          done

      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: ushly-frontend-${{ github.run_id }}

      - name: Upload frontend to S3
        working-directory: frontend
        run: aws s3 sync dist/ "s3://${S3_BUCKET}/" --delete --only-show-errors

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*' \
            --no-cli-pager

  backend:
    name: Deploy backend
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      LAMBDA_FUNCTION: ${{ vars.LAMBDA_FUNCTION }}
      LOCAL_IMAGE_TAG: ushly:lambda-${{ github.event.workflow_run.head_sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate required backend variables
        run: |
          for name in AWS_REGION AWS_ROLE_ARN ECR_REPOSITORY LAMBDA_FUNCTION; do
            if [[ -z "${!name}" ]]; then
              echo "Required repository variable $name is not configured." >&2
              exit 1
            fi
          done

      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Build verified Lambda image
        working-directory: backend
        env:
          LAMBDA_IMAGE_TAG: ${{ env.LOCAL_IMAGE_TAG }}
        run: npm run build:lambda-image

      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: ushly-backend-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Tag and push immutable Lambda image
        id: backend-image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${DEPLOY_SHA}"
          docker tag "$LOCAL_IMAGE_TAG" "$image_uri"
          docker push "$image_uri"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Update Lambda to the tested image
        env:
          IMAGE_URI: ${{ steps.backend-image.outputs.image_uri }}
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --image-uri "$IMAGE_URI" \
            --publish \
            --no-cli-pager
          aws lambda wait function-updated-v2 \
            --function-name "$LAMBDA_FUNCTION"
