<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="Ushly frontend foundation." />
    <meta name="robots" content="noindex, nofollow" />
    <link
      id="favicon"
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32-dark.png"
    />
    <link
      id="apple-icon"
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon-180x180-dark.png"
    />
    <link id="app-manifest" rel="manifest" href="/manifest-dark.webmanifest" />
    <!-- Read the preference before CSS paints, so saved light mode does not flash dark. -->
    <script src="/theme-init.js"></script>
    <title>Ushly · Frontend foundation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
